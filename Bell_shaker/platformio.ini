; PlatformIO Project Configuration File
;
; Bell_shaker (Teensy 4.1)

[platformio]
default_envs = teensy40

[env:teensy40]
platform = teensy
board = teensy41
framework = arduino
upload_protocol = teensy-cli
monitor_port = /dev/ttyACM*
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0

lib_deps =
    mjbots/Moteus@1.0.2
    pierremolinaro/ACAN2517FD@^2.1.5
