; PlatformIO Project Configuration File — Domino controller
; Teensy 4.0 / SMA Controller v1.6

[env:teensy40]
platform = teensy
board = teensy40
framework = arduino
upload_protocol = teensy-cli
monitor_port = /dev/ttyACM0
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit PWM Servo Driver Library@^3.0.0
