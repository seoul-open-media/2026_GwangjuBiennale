; PlatformIO Project Configuration File — Domino controller
; Teensy 4.0 / SMA Controller v1.6

[env:teensy40]
platform = teensy
board = teensy40
framework = arduino
upload_protocol = teensy-cli
monitor_port = /dev/ttyACM0
lib_deps =
    adafruit/Adafruit PWM Servo Driver Library@^3.0.0
build_flags =
    -D SERIAL1_RX_BUFFER_SIZE=1024  ; I2C 헬스체크 블로킹(최대 ~50ms) 중에도 XBee 프레임(Serial1)을 유실 없이 버퍼링
