; hardware_test — 마이크로모드 Teensy 하드웨어 통합 테스트
; MicroMod Teensy = Teensy 4.1 칩 (iMXRT1062) — Wire3/pin42·43 사용을 위해 teensy41 지정
[env:teensy40]
platform = teensy
board = teensy41
framework = arduino
upload_protocol = teensy-cli
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.3
    adafruit/Adafruit MLX90614 Library@^2.1.3
